    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: var(--ink); background: var(--bg); line-height: 1.55;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  a { color: inherit; }
  img { max-width: 100%; display: block; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; width: 100%; }

  /* ---------- header ---------- */
  header.site {
    position: sticky; top: 0; z-index: 40;
    background: rgba(255,255,255,0.86);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid rgba(0,0,0,0.05);
  }
  .nav { display: flex; align-items: center; height: 68px; }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 18px; letter-spacing: -0.01em;
    color: var(--ink); text-decoration: none;
  }
  .brand img { width: 32px; height: 32px; border-radius: 7px; }
  .brand em { font-style: normal; color: var(--brand); }

  /* ---------- hero + steps ---------- */
  main.welcome {
    flex: 1; padding: 48px 0 96px;
    background: radial-gradient(60% 50% at 50% 0%, var(--brand-50) 0%, transparent 60%), #fff;
  }
  .hero-block { text-align: center; margin-bottom: 80px; }
  .hero-block h1 {
    font-size: 56px; font-weight: 800; letter-spacing: -0.035em;
    line-height: 1.05; margin: 0; text-wrap: balance;
  }
  .hero-block h1 em { font-style: normal; color: var(--brand); }
  .hero-block .lede {
    margin: 22px auto 0; font-size: 19px; font-weight: 500;
    color: var(--ink-2); max-width: 580px; line-height: 1.5; text-wrap: balance;
  }

  .step { margin: 0 auto 80px; max-width: 820px; text-align: center; }
  .step:last-of-type { margin-bottom: 0; }
  .step h2 {
    font-size: 26px; font-weight: 700; letter-spacing: -0.02em;
    line-height: 1.3; margin: 0 0 32px; text-wrap: balance; color: var(--ink);
  }
  .step h2 em { font-style: normal; color: var(--brand); }
  /* slot for a real product screenshot (optional — see SKILL.md) */
  .step img.shot {
    width: 100%; height: auto; border-radius: 14px;
    box-shadow: 0 30px 60px -28px rgba(15,15,20,0.28), 0 0 0 1px rgba(0,0,0,0.04);
  }

  /* ---------- Chrome toolbar mock (drawn in CSS — no screenshot needed) ---------- */
  .cw { max-width: 720px; margin: 0 auto; }
  .cw-bar {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 9px 12px;
    box-shadow: 0 24px 50px -30px rgba(15,15,20,0.30), 0 0 0 1px rgba(0,0,0,0.03);
  }
  .cw-omni {
    flex: 1; display: flex; align-items: center; gap: 8px;
    background: var(--cw-omni); border-radius: 999px;
    padding: 8px 14px; color: var(--cw-fg); font-size: 14px;
    min-width: 0;
  }
  .cw-omni span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cw-omni svg { width: 14px; height: 14px; flex: none; }
  .cw-tools { display: flex; align-items: center; gap: 6px; flex: none; }
  .cw-ico {
    position: relative; width: 34px; height: 34px; border-radius: 999px;
    display: grid; place-items: center; color: var(--cw-fg);
  }
  .cw-ico svg { width: 20px; height: 20px; }
  .cw-ico img { width: 22px; height: 22px; border-radius: 5px; }
  .cw-ico--hl { background: var(--brand-50); box-shadow: 0 0 0 2px var(--brand); }
  .cw-avatar { width: 28px; height: 28px; border-radius: 999px; background: linear-gradient(135deg,#c7cdd6,#9aa0a6); flex: none; }
  /* numbered badge that ties the picture to the step number */
  .cw-num {
    position: absolute; top: -7px; right: -7px;
    min-width: 20px; height: 20px; padding: 0 5px;
    background: var(--brand); color: #fff; border-radius: 999px;
    font-size: 12px; font-weight: 800; font-style: normal;
    display: grid; place-items: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25); border: 2px solid #fff;
  }

  /* the Extensions popover menu */
  .cw-menu {
    width: 340px; max-width: 100%; margin: 12px 0 0 auto;
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 10px; text-align: left;
    box-shadow: 0 30px 60px -30px rgba(15,15,20,0.35), 0 0 0 1px rgba(0,0,0,0.03);
  }
  .cw-menu-h {
    font-size: 13px; font-weight: 700; color: var(--cw-fg-2);
    padding: 6px 8px 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px;
  }
  .cw-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 8px; border-radius: 9px;
  }
  .cw-row--active { background: var(--brand-50); }
  .cw-row-ic { width: 22px; height: 22px; border-radius: 5px; flex: none; }
  .cw-row-name { flex: 1; font-size: 14px; color: var(--cw-fg-2); font-weight: 600; }
  .cw-ghost { background: #e3e6ea; }
  .cw-bar-ghost { height: 10px; border-radius: 999px; background: #e3e6ea; }
  .cw-pin {
    position: relative; width: 30px; height: 30px; border-radius: 999px;
    display: grid; place-items: center; color: #b3b8be; flex: none;
  }
  .cw-pin svg { width: 18px; height: 18px; }
  .cw-pin--on { color: var(--brand); background: var(--brand-50); }

  /* primary CTA button (used by new-tab / external-site modes) */
  .cta-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--brand); color: #fff; text-decoration: none;
    font-weight: 700; font-size: 17px; padding: 15px 30px; border-radius: 999px;
    box-shadow: 0 16px 34px -14px var(--brand); transition: transform .12s, box-shadow .12s;
  }
  .cta-btn:hover { transform: translateY(-1px); box-shadow: 0 20px 40px -14px var(--brand); }

  /* ---------- footer ---------- */
  footer.site { padding: 40px 0 60px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 14px; }
  .foot { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
  .foot a { color: var(--ink-3); text-decoration: none; }
  .foot a:hover { color: var(--brand); }
  .foot .links { display: flex; gap: 22px; }

  @media (max-width: 760px) {
    main.welcome { padding: 56px 0 72px; }
    .hero-block { margin-bottom: 56px; }
    .hero-block h1 { font-size: 38px; }
    .hero-block .lede { font-size: 17px; }
    .step h2 { font-size: 21px; margin-bottom: 22px; }
    .step { margin-bottom: 56px; }
    .cw-menu { width: 100%; }
  }
</style>
</head>
